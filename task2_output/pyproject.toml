[project]
name = "nsclc-luad-lusc-classification"
version = "0.1.0"
description = "NSCLC LUAD vs LUSC classification using deep learning"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "tqdm>=4.50.0",
    "openslide-python>=1.1.2",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
train = "train_nsclc_v2:main"

[tool.setuptools]
py-modules = ["train_nsclc", "train_nsclc_v2"]
