[project]
name = "gc-im-detection"
version = "0.1.0"
description = "Gastric Intestinal Metaplasia detection in gastric biopsies"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "tqdm>=4.50.0",
    "openslide-python>=1.1.2",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
